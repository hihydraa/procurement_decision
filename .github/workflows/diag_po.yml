name: Diagnose PO purchases vs market (read-only)

# รันมือเท่านั้น : อ่านไฟล์ PO รายเดือนจาก Drive เทียบกับ PriceLog — ไม่เขียนอะไรลงชีท
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Diagnose PO
        run: python diag_po.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
