name: Forecast card (shadow, ForecastCardLog)

# การ์ดพยากรณ์โหมดเงา 2 รอบ/วัน (11:00 และ 21:30 น. เวลาไทย) บันทึกลงแท็บ ForecastCardLog พร้อมเติมผลจริงย้อนหลัง
# ไม่ส่ง LINE ไม่กระทบการตัดสินใจ ; cron ของ GitHub อาจมาช้า/ข้ามรอบ จึงเป็นเวลาโดยประมาณ
on:
  schedule:
    - cron: "0 4 * * *"     # 11:00 ICT
    - cron: "30 14 * * *"   # 21:30 ICT
  workflow_dispatch:
    inputs:
      round:
        description: "รอบ (11:00 หรือ 21:30)"
        default: "21:30"
      dry:
        description: "dry-run (ไม่เขียนชีท)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: forecast-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # ดึงข้อมูลข้ามชีทก่อนสร้างการ์ด (MOPS ปิดตลาด, ฟีดสัญญาณ, EPPO) : workflow แดชบอร์ดพึ่งตัวตั้งเวลาของ GitHub ซึ่งข้ามรอบบ่อย
      # ถ้าไม่ดึงเอง การ์ดรอบ 21:30 จะเห็น MOPS ของเมื่อวานแล้วตั้งวันเป้าหมายผิด (เกิดจริง 12/11/2026) ; dry-run ไม่เขียนชีทจึงข้ามขั้นนี้
      - name: Refresh source data into the sheet
        if: github.event_name == 'schedule' || inputs.dry != true
        run: python ingest.py
        continue-on-error: true
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Build forecast card
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then R="11:00"; else R="21:30"; fi
            python forecast_card.py "$R"
          else
            if [ "${{ inputs.dry }}" = "true" ]; then python forecast_card.py "${{ inputs.round }}" --dry; else python forecast_card.py "${{ inputs.round }}"; fi
          fi
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}

      # ---- ข้อความไลน์ส่วนตัว (ช่วงทดสอบ) : เฉพาะรอบ 21:30 — คำนวณแนวโน้มรอบ 20:30, บันทึก OutlookLog + เติมผลจริง, แล้วส่งข้อความ ----
      # ทุกขั้นล้มได้โดยไม่กระทบการ์ด ; ไม่มี Secret LINE_TEST_USER_ID = ไม่ส่ง ; dry-run พิมพ์ข้อความอย่างเดียว
      - name: Build outlook (20:30) for the LINE test message
        if: (github.event_name == 'schedule' && github.event.schedule == '30 14 * * *') || inputs.round == '21:30'
        run: python main.py
        continue-on-error: true
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Log outlook + fill outcomes (OutlookLog)
        if: ((github.event_name == 'schedule' && github.event.schedule == '30 14 * * *') || inputs.round == '21:30') && (github.event_name == 'schedule' || inputs.dry != true)
        run: python log_outlook.py
        continue-on-error: true
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Send outlook to the owner's personal LINE (test)
        if: (github.event_name == 'schedule' && github.event.schedule == '30 14 * * *') || inputs.round == '21:30'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.dry }}" = "true" ]; then python line_outlook.py --dry; else python line_outlook.py; fi
        continue-on-error: true
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
