name: Diagnose PriceLog (discounts, jobber gaps, change timing; read-only)

# รันมือเท่านั้น : ตรวจส่วนลดต้องบุญ, ส่วนต่างต้องบุญ/ศรีพลัง และเวลาที่ราคาเปลี่ยนจริงจาก PriceLog — ไม่เขียนอะไรลงชีท
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Diagnose
        run: python diag_pricelog.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Tap-time price profile
        run: python diag_tap_profile.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Retail price vs wholesale lag (Entry_Eppo RETAIL)
        run: python diag_retail_lag.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: PO purchases vs market (Drive PO files)
        run: python diag_po.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Plan evaluation (Forecast Log Plan/Backtest vs PriceLog)
        run: python diag_plan_eval.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: PriceLog gaps (pipeline stop vs quiet)
        run: python diag_pricelog_gaps.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Decision-rule backtest (MOPS/WTI/margin/fund vs wholesale change)
        run: python diag_rule_backtest.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
      - name: Walk-forward by components (ex-refinery + known fund vs baselines)
        run: python diag_wf_components.py
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
