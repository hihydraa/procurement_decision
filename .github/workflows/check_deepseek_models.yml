name: Check DeepSeek models (weekly)

# ตรวจว่าชื่อโมเดลที่ worker/news.py ใช้อยู่ยังเรียกได้ — ล้ม (สีแดง) เมื่อชี้ชัดว่าโมเดลหาย/ถูกปฏิเสธ
# หมายเหตุ: GitHub ส่งอีเมลแจ้ง workflow ที่ล้มให้ผู้ที่ติดตาม repo ตามค่าเริ่มต้น (ไม่ใช่ระบบแจ้งเตือนของโปรเจกต์)
on:
  schedule:
    - cron: '17 2 * * 1'      # ทุกวันจันทร์ 09:17 ICT
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check DeepSeek model names
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # ถ้าตั้งชื่อโมเดลทับใน Cloudflare ให้ตั้งตัวแปร repository ชื่อเดียวกัน (ว่าง = ใช้ค่าเริ่มต้น deepseek-chat / deepseek-flash)
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_VISION_MODEL: ${{ vars.DEEPSEEK_VISION_MODEL }}
        run: python check_models.py
