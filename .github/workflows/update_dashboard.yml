name: Update Oil Price Dashboard

on:
  schedule:
    - cron: '0 0,6,10,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch source data (EPPO, MOPS, Oil Fund) into the sheet
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
        run: python ingest.py
        # ไม่ให้การดึงข้อมูลล้มเหลว (เว็บแหล่งข้อมูลล่ม, รูปแบบเปลี่ยน ฯลฯ) ไปบล็อกการอัปเดต
        # dashboard จากข้อมูลที่มีอยู่แล้ว — แต่ step นี้จะยังโชว์ว่าล้มเหลวใน Actions UI ให้เห็น
        continue-on-error: true

      - name: Fetch WTI price (OilPriceAPI) into the sheet
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: python fetch_wti.py
        continue-on-error: true

      - name: Generate daily news summary (DeepSeek API) into the sheet
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python news.py
        continue-on-error: true

      - name: Build dashboard
        run: python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
