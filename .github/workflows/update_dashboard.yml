name: Update Oil Price Dashboard

on:
  schedule:
    # 07:00 / 13:00 / 17:00 / 21:00 ICT เดิม + 15:45 และ 20:45 ICT (ใกล้จุดตัดสินใจ PM 15:30 / EVE 20:30 ที่โมเดลฝึกไว้)
    - cron: '0 0,6,10,14 * * *'
    - cron: '45 8,13 * * *'
    # สำรองช่วงค่ำ 21:30 / 22:30 / 23:30 ICT (นอกจาก 20:45 และ 21:00 เดิม): GitHub เลื่อนรอบ schedule ไป 1-4 ชม. บ่อย ๆ ช่วง 20:30-24:00 คือช่วงที่โมเดลแม่นที่สุด
    # (ประกาศกองทุน + MOPS ปิด) และทดสอบเดินหน้านับเฉพาะรอบแรกของช่วง จึงเพิ่มโอกาสที่อย่างน้อยหนึ่งรอบจะมาทันก่อนเที่ยงคืน
    - cron: '30 14,15,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch source data (EPPO, MOPS, Oil Fund) into the sheet
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
        run: python ingest.py
        # ไม่ให้การดึงข้อมูลล้มเหลว (เว็บแหล่งข้อมูลล่ม, รูปแบบเปลี่ยน ฯลฯ) ไปบล็อกการอัปเดต
        # dashboard จากข้อมูลที่มีอยู่แล้ว — แต่ step นี้จะยังโชว์ว่าล้มเหลวใน Actions UI ให้เห็น
        continue-on-error: true

      - name: Fetch WTI price (OilPriceAPI) into the sheet
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: python fetch_wti.py
        continue-on-error: true

      - name: Generate daily news summary (DeepSeek API) into the sheet
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python news.py
        continue-on-error: true

      - name: Build dashboard
        run: python main.py

      - name: Log decisions + fill outcomes (DecisionLog)
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
        run: python log_decisions.py
        continue-on-error: true

      - name: Log dispatch plan + fill outcomes (DispatchLog, forward test)
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
        run: python log_dispatch.py
        continue-on-error: true

      - name: Log outlook (24/48h) + fill outcomes (OutlookLog, forward test)
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PRIVATE_KEY: ${{ secrets.SA_PRIVATE_KEY }}
        run: python log_outlook.py
        continue-on-error: true

      - name: Prepare publish directory (index.html + outlook.json)
        # เผยแพร่เฉพาะหน้าเว็บ ไม่ใช่ทั้งรีโป: (1) .gitignore ของรีโปมี index.html ซึ่งทำให้ git add --all ในขั้น deploy ข้ามไฟล์นี้ ->
        # gh-pages ไม่มี index.html -> หน้า 404 (เกิดแล้วเมื่อ 21 ต.ค. 2026) (2) ไม่เผยแพร่โค้ด/พารามิเตอร์โมเดล/ไฟล์คำแนะนำล่าสุดโดยไม่จำเป็น
        run: |
          test -s index.html || { echo "index.html is missing or empty - refusing to deploy"; exit 1; }
          mkdir -p public
          cp index.html public/index.html
          # outlook.json = ข้อความแนวโน้ม + ระดับ (ไม่มีข้อมูลดิบ/พารามิเตอร์โมเดล) ให้ oil-bot ดึงไปส่งเข้าไลน์ตามคำขอ
          test -s outlook.json && cp outlook.json public/outlook.json || echo "no outlook.json - skipping"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
